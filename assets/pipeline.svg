<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="End-to-end delivery pipeline: idea, architecture, code, infra, production">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#BC8CFF"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#BC8CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BC8CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2">
      <stop offset="0%" stop-color="#BC8CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BC8CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M 90 150 L 292 150 L 495 150 L 697 150 L 830 150"/>
  </defs>

  <!-- drifting auras -->
  <circle cx="180" cy="80" r="130" fill="url(#aura)">
    <animate attributeName="cx" values="180;320;180" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="110" r="140" fill="url(#aura2)">
    <animate attributeName="cx" values="720;580;720" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- constellation -->
  <g stroke="#58A6FF" stroke-opacity="0.25" stroke-width="1">
    <line x1="120" y1="58" x2="238" y2="34"><animate attributeName="stroke-opacity" values="0.05;0.3;0.05" dur="6s" repeatCount="indefinite"/></line>
    <line x1="238" y1="34" x2="352" y2="72"><animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="7s" repeatCount="indefinite"/></line>
    <line x1="352" y1="72" x2="470" y2="40"><animate attributeName="stroke-opacity" values="0.05;0.28;0.05" dur="8.5s" repeatCount="indefinite"/></line>
    <line x1="470" y1="40" x2="596" y2="66"><animate attributeName="stroke-opacity" values="0.25;0.05;0.25" dur="6.5s" repeatCount="indefinite"/></line>
    <line x1="596" y1="66" x2="712" y2="32"><animate attributeName="stroke-opacity" values="0.05;0.3;0.05" dur="9s" repeatCount="indefinite"/></line>
    <line x1="712" y1="32" x2="800" y2="74"><animate attributeName="stroke-opacity" values="0.28;0.05;0.28" dur="7.5s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#58A6FF">
    <circle cx="120" cy="58" r="2.5"><animate attributeName="r" values="2;3.6;2" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="58;50;58" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="34" r="2"><animate attributeName="r" values="3.4;1.8;3.4" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="34;44;34" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="72" r="3"><animate attributeName="r" values="2.2;4;2.2" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="72;62;72" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="40" r="2.2" fill="#BC8CFF"><animate attributeName="r" values="3.6;2;3.6" dur="4.5s" repeatCount="indefinite"/><animate attributeName="cy" values="40;52;40" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="596" cy="66" r="2.8" fill="#BC8CFF"><animate attributeName="r" values="2;3.8;2" dur="5.5s" repeatCount="indefinite"/><animate attributeName="cy" values="66;56;66" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="712" cy="32" r="2.4" fill="#BC8CFF"><animate attributeName="r" values="3.2;1.8;3.2" dur="6.5s" repeatCount="indefinite"/><animate attributeName="cy" values="32;42;32" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="74" r="2.6" fill="#BC8CFF"><animate attributeName="r" values="2;3.6;2" dur="5.2s" repeatCount="indefinite"/><animate attributeName="cy" values="74;64;74" dur="12.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rail -->
  <line x1="70" y1="150" x2="830" y2="150" stroke="url(#fade)" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="830" y2="150" stroke="url(#beam)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="90 670" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="760" to="0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- stage nodes -->
  <g>
    <circle cx="90" cy="150" r="7" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="90" cy="150" r="7" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="7;20" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="292" cy="150" r="7" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="292" cy="150" r="7" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="7;20" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="495" cy="150" r="7" fill="#0D1117" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="495" cy="150" r="7" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="7;20" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="697" cy="150" r="7" fill="#0D1117" stroke="#BC8CFF" stroke-width="2.5"/>
    <circle cx="697" cy="150" r="7" fill="none" stroke="#BC8CFF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="7;20" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="150" r="8" fill="#0D1117" stroke="#3FB950" stroke-width="2.5"/>
    <circle cx="830" cy="150" r="8" fill="none" stroke="#3FB950" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="8;24" dur="3s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- travelling packet -->
  <circle r="5" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
    <animate attributeName="fill" values="#58A6FF;#8B5CF6;#BC8CFF;#3FB950" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- labels -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B949E" text-anchor="middle" letter-spacing="1">
    <text x="90" y="186">IDEA</text>
    <text x="292" y="186">ARCHITECTURE</text>
    <text x="495" y="186">CODE</text>
    <text x="697" y="186">INFRA</text>
    <text x="830" y="186">PRODUCTION</text>
  </g>

  <text x="450" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6E7681" text-anchor="middle" letter-spacing="2">
    end-to-end delivery
    <animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
