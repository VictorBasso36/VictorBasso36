<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Raymarching</title>
<meta name="description" content="Realtime WebGL2 raymarching demo — signed distance fields, soft shadows and ambient occlusion."/>
<meta name="theme-color" content="#0B0E14"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>"/>
<style>
  html,body{margin:0;height:100%;background:#0B0E14;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#8B949E;
       font:400 14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;padding:24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">WebGL2 is not available in this browser.</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;

uniform vec2  uRes;
uniform float uPhase;
uniform vec2  uMouse;
uniform int   uScene;
uniform float uFlash;

out vec4 outColor;

#define TAU 6.283185307179586

const vec3 BLUE = vec3(0.345, 0.651, 1.000);
const vec3 PURP = vec3(0.737, 0.549, 1.000);
const vec3 CYAN = vec3(0.224, 0.816, 0.847);
const vec3 WARM = vec3(1.000, 0.482, 0.278);

mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

float sdBox(vec3 p, vec3 b){
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}
float sdSphere(vec3 p, float r){ return length(p) - r; }
float sdTorus(vec3 p, vec2 t){
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }

vec2 map(vec3 p){
  float A = uPhase * TAU;

  if (uScene == 1){
    vec3 c = vec3(2.6);
    vec3 q = mod(p + 0.5 * c, c) - 0.5 * c;
    float cube = sdBox(q, vec3(0.46 + 0.10 * sin(A))) - 0.07;
    float rodZ = length(q.xy) - 0.055;
    float rodX = length(q.yz) - 0.055;
    float lattice = min(cube, min(rodZ, rodX));
    float tunnel = length(p.xy - vec2(0.0, 0.5)) - 1.25;
    return vec2(max(lattice, -tunnel), 4.0);
  }

  if (uScene == 2){
    float s = 2.7;
    vec3 q = p;
    q.z += uPhase * (TAU / s);
    q.xz *= rot(A);
    float g = (abs(dot(sin(q * s), cos(q.yzx * s))) - 0.62) / (s * 1.35);
    return vec2(max(g, sdSphere(p, 1.95)), 5.0);
  }

  vec3 q = p;
  q.xz *= rot(A);
  q.xy *= rot(2.0 * A);
  float box  = sdBox(q, vec3(0.70)) - 0.20;
  float sph  = sdSphere(p, 1.00 + 0.11 * sin(A));
  float core = smin(box, sph, 0.52);

  vec3 tq = p;
  tq.xy *= rot(A);
  float ring = sdTorus(tq.xzy, vec2(1.75, 0.055));

  float floorY = p.y + 1.55;

  vec2 res = vec2(core, 1.0);
  res = opU(res, vec2(ring, 2.0));
  res = opU(res, vec2(floorY, 3.0));
  return res;
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(1.0, -1.0) * 0.0012;
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x +
                   e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.06;
  for (int i = 0; i < 26; i++){
    float h = map(ro + rd * t).x;
    res = min(res, 9.0 * h / t);
    t += clamp(h, 0.03, 0.55);
    if (res < 0.004 || t > 14.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++){
    float h = 0.02 + 0.13 * float(i);
    occ += (h - map(p + n * h).x) * sca;
    sca *= 0.72;
  }
  return clamp(1.0 - 1.45 * occ, 0.0, 1.0);
}

vec3 aces(vec3 x){
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

vec3 background(vec3 rd){
  float y = rd.y * 0.5 + 0.5;
  vec3 c = mix(vec3(0.028, 0.036, 0.055), vec3(0.052, 0.072, 0.118), y);
  c += BLUE * 0.10 * pow(max(dot(rd, normalize(vec3(-0.45, 0.35, -0.8))), 0.0), 6.0);
  c += PURP * 0.05 * pow(max(dot(rd, normalize(vec3(0.7, 0.1, 0.5))), 0.0), 10.0);
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  float A = uPhase * TAU;

  vec3 ro, ta;
  if (uScene == 1){
    ro = vec3(uMouse.x * 1.1, 0.5 + uMouse.y * 0.9, 4.0 - uPhase * 2.6);
    ta = ro + vec3(uMouse.x * 0.5, uMouse.y * 0.4, -1.0);
  } else {
    float ang = A + uMouse.x * 1.6;
    float rad = uScene == 2 ? 4.6 : 4.4;
    ro = vec3(sin(ang) * rad, 0.85 + uMouse.y * 1.5, cos(ang) * rad);
    ta = vec3(0.0, uScene == 2 ? 0.0 : -0.1, 0.0);
  }

  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.55 * fw);

  float t = 0.0, m = -1.0;
  for (int i = 0; i < 120; i++){
    vec3 p = ro + rd * t;
    vec2 h = map(p);
    if (h.x < 0.0013 * t + 0.0006){ m = h.y; break; }
    t += h.x * 0.88;
    if (t > 42.0) break;
  }

  vec3 col;
  if (m < 0.0){
    col = background(rd);
  } else {
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p);
    vec3 lig = normalize(vec3(0.62, 0.86, -0.45));

    vec3 albedo;
    if (m < 1.5){
      albedo = mix(BLUE, PURP, 0.5 + 0.5 * n.y) * 0.42;
    } else if (m < 2.5){
      albedo = CYAN * 0.55;
    } else if (m < 3.5){
      vec2 g = abs(fract(p.xz * 0.5) - 0.5);
      float w = fwidth(p.x * 0.5) * 1.6 + 0.004;
      float line = 1.0 - smoothstep(0.0, w, min(g.x, g.y));
      float fade = exp(-0.055 * length(p.xz));
      albedo = mix(vec3(0.030, 0.038, 0.058), BLUE * 0.75, line * fade);
    } else if (m < 4.5){
      albedo = mix(BLUE, CYAN, 0.5 + 0.5 * sin(p.z * 0.5 + A)) * 0.40;
    } else {
      albedo = mix(CYAN, PURP, 0.5 + 0.5 * n.y) * 0.46 + WARM * 0.03;
    }

    float occ = calcAO(p, n);
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float sha = softShadow(p + n * 0.025, lig);
    float bac = clamp(dot(n, normalize(vec3(-lig.x, 0.0, -lig.z))), 0.0, 1.0);
    float fre = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 3.2);
    float spe = pow(clamp(dot(reflect(rd, n), lig), 0.0, 1.0), 42.0);

    vec3 key  = vec3(1.00, 0.94, 0.88);
    col  = albedo * key * (1.45 * dif * sha);
    col += albedo * PURP * (0.55 * bac) * occ;
    col += albedo * vec3(0.09, 0.12, 0.20) * occ;
    col += CYAN * fre * 0.55 * occ;
    col += key * spe * 0.45 * sha;

    col = mix(col, background(rd), 1.0 - exp(-0.030 * t * t * 0.35));
  }

  col += BLUE * uFlash * 0.16;

  col = aces(col * 1.05);
  col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, 1.28);
  col = pow(max(col, 0.0), vec3(0.4545));

  vec2 q = gl_FragCoord.xy / uRes;
  col *= 0.58 + 0.42 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.22);

  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;

  outColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  "use strict";
  const PERIOD = 6.0;
  const params = new URLSearchParams(location.search);
  const capture = params.has("phase");

  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
  if (!gl) { canvas.style.display = "none"; document.getElementById("err").style.display = "grid"; return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());

  const U = {
    res:   gl.getUniformLocation(prog, "uRes"),
    phase: gl.getUniformLocation(prog, "uPhase"),
    mouse: gl.getUniformLocation(prog, "uMouse"),
    scene: gl.getUniformLocation(prog, "uScene"),
    flash: gl.getUniformLocation(prog, "uFlash")
  };

  let scale = capture ? 1 : 0.85;
  let scene = Math.min(2, Math.max(0, parseInt(params.get("scene") || "0", 10) || 0));
  let flash = 0;
  const mouse = { tx: 0, ty: 0, x: 0, y: 0 };

  function resize() {
    const dpr = capture ? 1 : Math.min(window.devicePixelRatio || 1, 1.75);
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr * scale));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function render(phase) {
    resize();
    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform1f(U.phase, phase);
    gl.uniform2f(U.mouse, mouse.x, mouse.y);
    gl.uniform1i(U.scene, scene);
    gl.uniform1f(U.flash, flash);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  if (capture) {
    window.__render = (ph, sc) => {
      if (typeof sc === "number") scene = sc;
      render(ph);
      gl.finish();
    };
    window.__render(parseFloat(params.get("phase")) || 0);
    document.title = "ready";
    return;
  }

  canvas.addEventListener("pointermove", e => {
    mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.ty = 1 - (e.clientY / window.innerHeight) * 2;
  });
  canvas.addEventListener("pointerleave", () => { mouse.tx = 0; mouse.ty = 0; });
  canvas.addEventListener("pointerdown", () => { scene = (scene + 1) % 3; flash = 1; });
  window.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "ArrowRight") { scene = (scene + 1) % 3; flash = 1; }
  });
  window.addEventListener("resize", resize);

  const start = performance.now();
  let last = start, slow = 0;

  function frame(now) {
    const dt = now - last; last = now;
    if (dt > 34 && scale > 0.5) { if (++slow > 20) { scale = Math.max(0.5, scale - 0.12); slow = 0; } }
    else if (dt < 15) slow = Math.max(0, slow - 1);

    mouse.x += (mouse.tx - mouse.x) * 0.045;
    mouse.y += (mouse.ty - mouse.y) * 0.045;
    flash *= 0.94;

    render(((now - start) / 1000 / PERIOD) % 1);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
