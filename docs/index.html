<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Victor Basso — Senior Software Engineer</title>
<meta name="description" content="Interactive profile of Victor Basso — Senior Software Engineer, generalist, tech lead. End-to-end delivery: architecture, cloud, infrastructure as code and AI engineering."/>
<meta property="og:title" content="Victor Basso — Senior Software Engineer"/>
<meta property="og:description" content="End-to-end delivery: architecture, cloud, IaC and AI engineering. Move your cursor around."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0B0E14; --bg2:#10151F;
    --fg:#E6EDF3; --muted:#8B949E; --dim:#6E7681;
    --backend:#58A6FF; --frontend:#39D0D8; --cloud:#BC8CFF; --ai:#3FB950; --cad:#FF7B47;
    --line:rgba(139,148,158,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed; inset:0; display:block; touch-action:none}
  .vignette{position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 35%, rgba(5,7,11,.75) 100%)}
  .ui{position:fixed; inset:0; display:flex; flex-direction:column;
    padding:clamp(18px,3vw,38px); pointer-events:none}
  .ui a,.ui button{pointer-events:auto}

  header{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px}
  .pulse{width:9px; height:9px; border-radius:50%; background:var(--ai);
    box-shadow:0 0 0 0 rgba(63,185,80,.65); animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  nav{display:flex; gap:8px; align-items:center}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    font:600 12.5px/1 Inter,sans-serif; letter-spacing:.4px;
    color:var(--muted); text-decoration:none; background:rgba(255,255,255,.04);
    border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer;
    transition:color .18s, border-color .18s, background .18s, transform .18s;
  }
  .btn:hover{color:var(--fg); border-color:rgba(88,166,255,.5); background:rgba(88,166,255,.10); transform:translateY(-1px)}

  main{flex:1; display:flex; flex-direction:column; justify-content:center; max-width:min(640px,92vw)}
  .kicker{font:600 12px/1 "JetBrains Mono",monospace; letter-spacing:3px; text-transform:uppercase;
    color:var(--backend); margin-bottom:16px}
  h1{margin:0 0 10px; font-size:clamp(32px,6vw,62px); line-height:1.02; font-weight:800; letter-spacing:-1.5px}
  .grad{background:linear-gradient(100deg,var(--backend),var(--cloud) 55%,var(--cad));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .role{margin:0 0 18px; font-size:clamp(15px,2.2vw,19px); font-weight:500; color:var(--fg); opacity:.92}
  .sub{margin:0 0 24px; font-size:clamp(13.5px,1.8vw,15.5px); line-height:1.65; color:var(--muted); max-width:52ch}
  .flow{font:600 11.5px/1 "JetBrains Mono",monospace; color:var(--dim); letter-spacing:1.2px; margin-bottom:26px}
  .flow b{color:var(--muted); font-weight:600}

  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
  .chip{font:600 11.5px/1 "JetBrains Mono",monospace; letter-spacing:.6px; color:var(--muted);
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:999px;
    padding:8px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    transition:all .18s}
  .chip i{width:7px; height:7px; border-radius:50%; background:currentColor; display:block}
  .chip:hover{color:var(--fg); border-color:rgba(255,255,255,.22)}
  .chip[aria-pressed="true"]{background:rgba(255,255,255,.08); color:var(--fg); border-color:currentColor}

  .links{display:flex; flex-wrap:wrap; gap:9px}
  footer{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .hint{font:400 11.5px/1.5 "JetBrains Mono",monospace; color:var(--dim); letter-spacing:.4px}
  .hint b{color:var(--muted); font-weight:600}

  #tip{position:fixed; z-index:5; pointer-events:none; opacity:0; transform:translate(-50%,-160%);
    transition:opacity .16s; background:rgba(13,17,23,.92); border:1px solid var(--line);
    backdrop-filter:blur(8px); border-radius:10px; padding:8px 12px; white-space:nowrap}
  #tip .t{font:600 13px/1.3 Inter,sans-serif; color:var(--fg)}
  #tip .c{font:600 10.5px/1.3 "JetBrains Mono",monospace; letter-spacing:1px; text-transform:uppercase; margin-top:3px}

  @media (max-width:760px){
    main{justify-content:flex-end; padding-bottom:6px; max-width:100%}
    .sub{display:none} .legend{gap:6px} .chip{padding:7px 11px; font-size:10.5px}
    footer{justify-content:center; text-align:center} .hint{text-align:center}
  }
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive tech stack constellation"></canvas>
<div class="vignette"></div>

<div class="ui">
  <header>
    <div class="brand"><span class="pulse"></span> Victor Basso</div>
    <nav>
      <button class="btn" id="lang" type="button">🇧🇷 PT</button>
      <a class="btn" href="https://github.com/VictorBasso36" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main>
    <div class="kicker" data-en="Senior Software Engineer" data-pt="Engenheiro de Software Sênior">Senior Software Engineer</div>
    <h1><span class="grad" data-en="Generalist." data-pt="Generalista.">Generalist.</span><br/><span data-en="End-to-end." data-pt="Ponta a ponta.">End-to-end.</span></h1>
    <p class="role" data-en="Tech Lead · São Paulo, Brazil" data-pt="Tech Lead · São Paulo, Brasil">Tech Lead · São Paulo, Brazil</p>
    <p class="sub" data-en="I design, build, ship and operate complete solutions — from the first conversation about the problem, through architecture and code, all the way to infrastructure, deployment and production."
       data-pt="Eu desenho, construo, entrego e opero soluções completas — da primeira conversa sobre o problema, passando por arquitetura e código, até infraestrutura, deploy e produção.">I design, build, ship and operate complete solutions.</p>
    <div class="flow"><b>IDEA</b> → <b>ARCHITECTURE</b> → <b>CODE</b> → <b>INFRA</b> → <b>PRODUCTION</b></div>

    <div class="legend" id="legend"></div>

    <div class="links">
      <a class="btn" href="https://www.linkedin.com/in/victor-basso-b3090a189/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn" href="mailto:victorbassodev@gmail.com">Email</a>
      <a class="btn" href="https://api.whatsapp.com/send/?phone=5511999978633" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </main>

  <footer>
    <div class="hint" data-en="Move the cursor · hover a node · click anywhere" data-pt="Mova o cursor · passe sobre um nó · clique em qualquer lugar">Move the cursor · hover a node · click anywhere</div>
    <div class="hint"><b id="fps">—</b> fps</div>
  </footer>
</div>

<div id="tip"><div class="t"></div><div class="c"></div></div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });
  const tip = document.getElementById("tip");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const CATS = {
    backend:  { color: "#58A6FF", en: "Backend",        pt: "Backend" },
    frontend: { color: "#39D0D8", en: "Frontend",       pt: "Frontend" },
    cloud:    { color: "#BC8CFF", en: "Cloud & Infra",  pt: "Cloud & Infra" },
    ai:       { color: "#3FB950", en: "AI Engineering", pt: "Engenharia de IA" },
    cad:      { color: "#FF7B47", en: "CAD & Product",  pt: "CAD & Produto" }
  };

  const STACK = [
    ["Node.js","backend"],["TypeScript","backend"],["NestJS","backend"],["GraphQL","backend"],
    ["PostgreSQL","backend"],["Prisma","backend"],["Redis","backend"],
    ["React","frontend"],["Next.js","frontend"],["Vite","frontend"],["Figma","frontend"],
    ["GCP","cloud"],["AWS","cloud"],["Terraform","cloud"],["Docker","cloud"],["CI/CD","cloud"],
    ["AI Agents","ai"],["RAG","ai"],["LLM Ops","ai"],["MCP","ai"],
    ["Fusion 360","cad"]
  ];

  let W = 0, H = 0, dpr = 1;
  const nodes = [], dust = [], ripples = [];
  const pointer = { x: -9999, y: -9999, active: false };
  let hovered = null, focus = null, t = 0;

  const rand = (a, b) => a + Math.random() * (b - a);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    nodes.length = 0;
    const cx = W * 0.5, cy = H * 0.5;
    const spread = Math.min(W, H) * 0.42;
    STACK.forEach(([label, cat], i) => {
      const a = (i / STACK.length) * Math.PI * 2 + rand(-0.18, 0.18);
      const r = spread * rand(0.55, 1.05);
      nodes.push({
        label, cat, color: CATS[cat].color,
        x: cx + Math.cos(a) * r * 1.12,
        y: cy + Math.sin(a) * r * 0.86,
        vx: rand(-0.22, 0.22), vy: rand(-0.22, 0.22),
        r: 4.6, base: 4.6, glow: 0, phase: rand(0, Math.PI * 2)
      });
    });

    dust.length = 0;
    const count = Math.round(Math.min(150, (W * H) / 11000));
    for (let i = 0; i < count; i++) {
      dust.push({ x: rand(0, W), y: rand(0, H), vx: rand(-0.16, 0.16), vy: rand(-0.16, 0.16), r: rand(0.5, 1.7) });
    }
  }

  function wrap(p) {
    const m = 30;
    if (p.x < -m) p.x = W + m; else if (p.x > W + m) p.x = -m;
    if (p.y < -m) p.y = H + m; else if (p.y > H + m) p.y = -m;
  }

  function step() {
    const damp = reduced ? 0.12 : 1;

    for (const d of dust) {
      d.x += d.vx * damp; d.y += d.vy * damp;
      if (pointer.active) {
        const dx = d.x - pointer.x, dy = d.y - pointer.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < 26000 && dist2 > 1) {
          const f = (1 - dist2 / 26000) * 0.55, inv = 1 / Math.sqrt(dist2);
          d.x += dx * inv * f; d.y += dy * inv * f;
        }
      }
      wrap(d);
    }

    const pad = 70;
    for (const n of nodes) {
      n.phase += 0.008 * damp;
      n.x += (n.vx + Math.cos(n.phase) * 0.12) * damp;
      n.y += (n.vy + Math.sin(n.phase * 0.8) * 0.12) * damp;

      if (n.x < pad) n.vx += 0.03; else if (n.x > W - pad) n.vx -= 0.03;
      if (n.y < pad) n.vy += 0.03; else if (n.y > H - pad) n.vy -= 0.03;

      if (pointer.active) {
        const dx = n.x - pointer.x, dy = n.y - pointer.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < 34000 && dist2 > 1) {
          const f = (1 - dist2 / 34000) * 1.25, inv = 1 / Math.sqrt(dist2);
          n.x += dx * inv * f; n.y += dy * inv * f;
        }
      }

      n.vx *= 0.986; n.vy *= 0.986;
      const target = (hovered === n ? 9.5 : n.base) * (focus && focus !== n.cat ? 0.7 : 1);
      n.r += (target - n.r) * 0.16;
      n.glow += ((hovered === n ? 1 : 0) - n.glow) * 0.14;
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += 5.5; rp.a -= 0.017;
      if (rp.a <= 0) ripples.splice(i, 1);
    }
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0B0E14"); g.addColorStop(0.55, "#0E1320"); g.addColorStop(1, "#0B0E14");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(139,148,158,.42)";
    for (const d of dust) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.fill(); }

    const LINK = 210, LINK2 = LINK * LINK;
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y, dist2 = dx * dx + dy * dy;
        if (dist2 > LINK2) continue;
        const same = a.cat === b.cat;
        let alpha = (1 - dist2 / LINK2) * (same ? 0.5 : 0.16);
        if (focus) alpha *= (a.cat === focus || b.cat === focus) ? 1.5 : 0.18;
        if (hovered && (hovered === a || hovered === b)) alpha = Math.min(1, alpha * 3.2);
        ctx.strokeStyle = same ? hex(a.color, alpha) : "rgba(139,148,158," + alpha.toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }

    if (pointer.active) {
      for (const n of nodes) {
        const dx = n.x - pointer.x, dy = n.y - pointer.y, dist2 = dx * dx + dy * dy;
        if (dist2 < 62000) {
          const alpha = (1 - dist2 / 62000) * 0.34;
          ctx.strokeStyle = hex(n.color, alpha);
          ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
        }
      }
    }

    for (const rp of ripples) {
      ctx.strokeStyle = hex(rp.color, Math.max(rp.a, 0));
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, 6.2832); ctx.stroke();
    }
    ctx.lineWidth = 1;

    for (const n of nodes) {
      const dim = focus && focus !== n.cat ? 0.22 : 1;
      const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * (5 + n.glow * 4));
      halo.addColorStop(0, hex(n.color, 0.42 * dim));
      halo.addColorStop(1, hex(n.color, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r * (5 + n.glow * 4), 0, 6.2832); ctx.fill();

      ctx.fillStyle = hex(n.color, 0.95 * dim);
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.font = '600 11px "JetBrains Mono", ui-monospace, monospace';
    ctx.textAlign = "center";
    for (const n of nodes) {
      const dim = focus && focus !== n.cat ? 0.18 : 1;
      const strong = hovered === n || focus === n.cat;
      ctx.fillStyle = "rgba(230,237,243," + (strong ? 0.96 : 0.5 * dim).toFixed(2) + ")";
      ctx.fillText(n.label, n.x, n.y - n.r - 10);
    }
  }

  function hex(c, a) {
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
  }

  let frames = 0, last = performance.now(), fpsEl = document.getElementById("fps");
  function loop(now) {
    t++; step(); draw();
    frames++;
    if (now - last > 1000) { fpsEl.textContent = frames; frames = 0; last = now; }
    requestAnimationFrame(loop);
  }

  function pick(x, y) {
    let best = null, bestD = 34 * 34;
    for (const n of nodes) {
      const dx = n.x - x, dy = n.y - y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  }

  function movePointer(x, y) {
    pointer.x = x; pointer.y = y; pointer.active = true;
    const hit = pick(x, y);
    if (hit !== hovered) {
      hovered = hit;
      canvas.style.cursor = hit ? "pointer" : "default";
      if (hit) {
        const lang = document.documentElement.dataset.lang;
        tip.querySelector(".t").textContent = hit.label;
        tip.querySelector(".c").textContent = CATS[hit.cat][lang];
        tip.querySelector(".c").style.color = hit.color;
        tip.style.opacity = "1";
      } else tip.style.opacity = "0";
    }
    if (hovered) { tip.style.left = hovered.x + "px"; tip.style.top = hovered.y + "px"; }
  }

  canvas.addEventListener("pointermove", e => movePointer(e.clientX, e.clientY));
  canvas.addEventListener("pointerleave", () => { pointer.active = false; hovered = null; tip.style.opacity = "0"; });
  canvas.addEventListener("pointerdown", e => {
    const hit = pick(e.clientX, e.clientY);
    ripples.push({ x: e.clientX, y: e.clientY, r: 6, a: 0.7, color: hit ? hit.color : "#58A6FF" });
    if (hit) {
      focus = focus === hit.cat ? null : hit.cat;
      syncChips();
      for (const n of nodes) {
        const dx = n.x - hit.x, dy = n.y - hit.y, d = Math.hypot(dx, dy) || 1;
        if (d < 260) { n.vx += (dx / d) * 2.4; n.vy += (dy / d) * 2.4; }
      }
    }
  });

  const legend = document.getElementById("legend");
  Object.entries(CATS).forEach(([key, cat]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.cat = key;
    b.style.color = cat.color;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<i></i><span data-en="' + cat.en + '" data-pt="' + cat.pt + '">' + cat.en + "</span>";
    b.addEventListener("click", () => { focus = focus === key ? null : key; syncChips(); });
    legend.appendChild(b);
  });

  function syncChips() {
    legend.querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", String(c.dataset.cat === focus)));
  }

  const langBtn = document.getElementById("lang");
  function setLang(lang) {
    document.documentElement.dataset.lang = lang;
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    langBtn.textContent = lang === "pt" ? "🇺🇸 EN" : "🇧🇷 PT";
    document.querySelectorAll("[data-en]").forEach(el => { el.textContent = el.dataset[lang]; });
    try { localStorage.setItem("vb-lang", lang); } catch (_) {}
  }
  langBtn.addEventListener("click", () =>
    setLang(document.documentElement.dataset.lang === "pt" ? "en" : "pt"));

  let saved = null;
  try { saved = localStorage.getItem("vb-lang"); } catch (_) {}
  setLang(saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en"));

  window.addEventListener("resize", () => { resize(); build(); });
  resize(); build(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
